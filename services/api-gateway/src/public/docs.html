<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAB System - Microservices API Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
    .header-bar {
      background: #0f172a;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3b82f6;
    }
    .header-bar h1 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header-bar .tag { background: #2563eb; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 4px; }
    .nav-tabs { display: flex; gap: 8px; background: #1e293b; padding: 8px 24px; overflow-x: auto; }
    .nav-btn {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover { background: #3b82f6; color: #fff; }
    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>🚖 CAB System – OpenAPI Specifications <span class="tag">Microservices</span></h1>
    <div>
      <a href="/" style="color: #60a5fa; text-decoration: none; font-size: 14px; font-weight: 500; margin-right: 15px;">← Về Dashboard</a>
      <a href="/health" target="_blank" style="color: #34d399; text-decoration: none; font-size: 14px; font-weight: 500;">Microservices Health Check</a>
    </div>
  </div>

  <div class="nav-tabs" id="specTabs">
    <button class="nav-btn active" onclick="loadSpec('customer')">Customer API (3001)</button>
    <button class="nav-btn" onclick="loadSpec('driver')">Driver API (3002)</button>
    <button class="nav-btn" onclick="loadSpec('trip')">Trip API (3003)</button>
    <button class="nav-btn" onclick="loadSpec('payment')">Payment & Rating API (3004)</button>
    <button class="nav-btn" onclick="loadSpec('notification')">Notification API (3005)</button>
    <button class="nav-btn" onclick="loadSpec('operations')">Operations API (3006)</button>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    const specFiles = {
      customer: '/specs/Customer.yaml',
      driver: '/specs/Driver.yaml',
      trip: '/specs/Trip.yaml',
      payment: '/specs/Payment.yaml',
      notification: '/specs/Notification.yaml',
      operations: '/specs/Operations.yaml'
    };

    let ui;
    function loadSpec(name) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.textContent.toLowerCase().includes(name));
      if (activeBtn) activeBtn.classList.add('active');

      ui = SwaggerUIBundle({
        url: specFiles[name],
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    }

    window.onload = () => {
      loadSpec('trip');
    };
  </script>
</body>
</html>
