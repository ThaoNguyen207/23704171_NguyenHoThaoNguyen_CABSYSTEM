openapi: 3.0.0
info:
  title: CAB System - Trip API
  version: 1.0.0
  description: "API xử lý đặt chuyến, phân công và trạng thái (FR01-FR08, FR16-FR21)"
paths:
  /api/trips:
    post:
      summary: "Tạo chuyến xe mới (UC04)"
      description: "Khách hàng yêu cầu đặt chuyến (AC01.2, AC01.3)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupLocation: 
                  type: string
                destination: 
                  type: string
                vehicleTypeId: 
                  type: integer
      responses:
        '201':
          description: "Tạo thành công, trạng thái là Searching (AC01.6)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: integer
                    example: 5001
                  status:
                    type: string
                    example: "Searching"
                  message:
                    type: string
                    example: "Yêu cầu đặt chuyến đã được tiếp nhận"
  /api/trips/{tripId}/driver-response:
    post:
      summary: "Tài xế Accept/Reject chuyến (UC13, UC14)"
      parameters:
        - name: tripId
          in: path
          required: true
          schema: 
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: 
                  type: string
                  enum: [ACCEPT, REJECT]
                rejectReason:
                  type: string
      responses:
        '200':
          description: "Ghi nhận phản hồi thành công (AC03.4)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: integer
                    example: 5001
                  status:
                    type: string
                    example: "DriverAccepted"
                  driverId:
                    type: integer
                    example: 88
  /api/trips/{tripId}/status:
    patch:
      summary: "Cập nhật trạng thái chuyến (UC15)"
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tripStatusId:
                  type: integer
      responses:
        '200':
          description: "Cập nhật trạng thái thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cập nhật trạng thái thành công"
