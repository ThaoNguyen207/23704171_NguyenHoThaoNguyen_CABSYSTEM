openapi: 3.0.0
info:
  title: CAB System - Driver API
  version: 1.0.0
  description: "API quản lý trạng thái và phương tiện của tài xế (UC11, UC17)"
paths:
  /api/drivers/{driverId}/status:
    patch:
      summary: "Cập nhật trạng thái sẵn sàng (UC11)"
      description: "Tài xế bật/tắt trạng thái sẵn sàng nhận chuyến (FR02, BRL04)"
      parameters:
        - name: driverId
          in: path
          required: true
          schema: 
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availabilityStatus: 
                  type: string
                  enum: [READY, BUSY, OFFLINE]
      responses:
        '200':
          description: "Cập nhật thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cập nhật trạng thái thành công"
  /api/drivers/{driverId}/vehicles:
    get:
      summary: "Lấy danh sách phương tiện (UC17)"
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    vehicleId:
                      type: integer
                      example: 101
                    licensePlate:
                      type: string
                      example: "59A-12345"
                    vehicleTypeId:
                      type: integer
                      example: 2
